<svg xmlns="http://www.w3.org/2000/svg" width="396pt" height="170pt" viewBox="0 0 396 170" role="img">
<title>scfr problem v4</title>
<desc>Schematic pleural-effusion carryover example, not an observed case. The assumed current exam has no effusion. With the same generator and current exam, a historical positive reappears in a report. No patient data, radiograph, model output, or radiologist judgment is depicted.</desc>
