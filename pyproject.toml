[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scfr-camera-ready"
version = "0.0.0"
description = "Local SCFR camera-ready source release candidate (not published)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
verifier = ["scikit-learn==1.7.2"]
analysis = ["numpy>=1.24,<3"]
generators = ["torch>=2.2", "Pillow>=10", "accelerate", "tqdm>=4.60", "sentencepiece", "protobuf", "einops"]
maira2 = ["torch>=2.2", "Pillow==11.3.0", "transformers==4.51.3", "tokenizers==0.21.1", "accelerate>=1,<2", "sentencepiece>=0.2,<1", "protobuf>=4.25,<7", "tqdm>=4.66,<5"]
medgemma = ["Pillow==11.3.0", "transformers==5.6.2", "accelerate>=1.10,<2", "sentencepiece>=0.2,<1", "protobuf>=4.25,<7", "safetensors>=0.4,<1"]
chexagent = ["transformers==4.40.0", "tokenizers==0.19.1", "Pillow==11.3.0", "accelerate>=1.10,<2", "bitsandbytes>=0.46,<1", "opencv-python-headless>=4.10,<5", "albumentations>=1.4,<3", "matplotlib>=3.8,<4", "einops>=0.8,<1", "sentencepiece>=0.2,<1", "protobuf>=4.25,<7"]
corrector = ["torch>=2.2", "transformers>=4.50,<5", "Pillow>=10", "accelerate", "peft", "bitsandbytes", "pandas", "numpy>=1.24,<3"]

[project.scripts]
scfr = "scfr_release.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scfr_release*", "scripts*", "src*", "train*", "utils*", "models*"]
exclude = ["tests*", "build*", "verification*"]

[tool.setuptools.package-data]
models = ["*.json"]
